[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ozark-wayfinder"
version = "0.1.0"
description = "Local canonical Markdown recall for Hermes with optional QMD and Mnemosyne evidence"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[tool.setuptools]
packages = ["ozark_wayfinder"]
package-dir = {ozark_wayfinder = "."}

[tool.setuptools.package-data]
ozark_wayfinder = ["plugin.yaml"]
