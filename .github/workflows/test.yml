name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python -m compileall -q __init__.py wayfinder.py backends.py
      - name: Unit suite (no host, no optional engines)
        run: python -m unittest discover -s tests -v
      - name: Clean wheel build and install
        run: python tools/verify_bootstrap.py
      - name: No host-specific absolute paths in shipped code
        run: |
          if grep -rn '/home/' __init__.py wayfinder.py backends.py plugin.yaml; then
            echo '::error::host-specific path in shipped code'
            exit 1
          fi
