manifest_version: 2
name: ozark-wayfinder
version: 0.1.0
description: Canonical Markdown recall with isolated optional QMD and read-only Mnemosyne evidence.
author: Ozark Wayfinder contributors
license: MIT
kind: standalone
provides_tools:
  - wayfinder_recall
  - wayfinder_open
  - wayfinder_checkpoint
  - wayfinder_health
python_dependencies: []
requires_env: []
config_schema:
  vault_root:
    type: str
    description: Explicit absolute path to an existing canonical Markdown vault. No default.
  curated_roots:
    type: list
    default: [curated]
  imported_roots:
    type: list
    default: [imports, sources]
  read_roots:
    type: list
    default: []
    description: Owner allowlist of vault-relative roots. Empty means the explicitly configured vault, minus exclusions.
  excluded_roots:
    type: list
    default: [restricted, private]
    description: Owner-denied vault-relative roots, applied before emitting any candidate or opening a passage.
  allow_unlinked_records:
    type: bool
    default: false
    description: Explicit operator opt-in to disclose unlinked global Mnemosyne records, outside Markdown path policy.
  checkpoint_profile_id:
    type: str
    default: ""
    description: Owner-chosen unique profile identity required for checkpoint proposals and apply, never a tool argument.
  enable_checkpoint:
    type: bool
    default: false
    description: Enable checkpoint proposals and human-operated apply; never authorizes tool writes.
  max_files:
    type: int
    default: 5000
  max_file_bytes:
    type: int
    default: 1048576
  mnemosyne_db:
    type: str
    description: Optional explicit absolute SQLite database path; read-only, global memories only.
  qmd_workspace:
    type: str
    description: Optional dedicated absolute QMD workspace, never an ambient index.
  qmd_command:
    type: list
    default: [qmd]
    description: Trusted local QMD executable argv prefix, not shell text.
  qmd_timeout:
    type: float
    default: 10
